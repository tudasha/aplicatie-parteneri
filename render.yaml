services:
  # Backend Web Service (using Docker for Java support)
  - type: web
    name: arttu-api
    runtime: docker
    dockerContext: PartnersDatabaseApp
    dockerfilePath: PartnersDatabaseApp/Dockerfile
    envVars:
      - key: DB_URL
        fromDatabase:
          name: arttu-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: arttu-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: arttu-db
          property: password
      - key: PORT
        value: 8081

  # Frontend Static Site
  - type: web
    name: arttu-frontend
    runtime: static
    rootDir: PartnersDatabaseApp/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: arttu-db
    plan: free
