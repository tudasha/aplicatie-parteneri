<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container" style="max-width: 400px; text-align: center;">
    <h2 class="burgundy-title" style="font-size: 2em; border:none;">LOGIN</h2>
    <p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <form action="/login" method="post">
        <input type="text" name="userOrEmail" placeholder="Username or Email" required
               style="width: 100%; padding: 10px; margin: 10px 0;"><br>
        <input type="password" name="password" placeholder="Password" required
               style="width: 100%; padding: 10px; margin: 10px 0;"><br>
        <button type="submit" class="btn-burgundy" style="width: 100%;">ENTER</button>
    </form>
    <p><a href="/register" style="color: #800020;">No account? Sign up here</a></p>
</div>
</body>
</html>
