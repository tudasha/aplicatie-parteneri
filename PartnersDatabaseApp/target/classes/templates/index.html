<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ARTTU Dashboard</title>
    <link rel="stylesheet" th:href="@{/style.css}">

    <style>
        /* BASE STYLES */
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; color: #333; min-height: 100vh; position: relative; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('/images/logo.svg') no-repeat center center; background-size: cover; filter: blur(15px) brightness(0.4); z-index: -1; transform: scale(1.1); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: rgba(0, 0, 0, 0.8); border-bottom: 3px solid #800020; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 50px; width: auto; }
        .logout-btn { color: #ff4d4d; text-decoration: none; font-weight: bold; margin-left: 10px; }

        .container { width: 90%; max-width: 1200px; margin: 30px auto; background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #f4f4f4; padding: 15px; border-radius: 8px; }

        /* BUTTONS */
        .btn-add { background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-filter { text-decoration: none; padding: 8px 15px; border-radius: 4px; border: 1px solid #ccc; color: #333; margin-left: 5px; font-weight: bold; }
        .btn-delete { background: transparent; border: 2px solid red; color: red; font-weight: bold; font-size: 16px; cursor: pointer; padding: 5px 10px; border-radius: 5px; }
        .btn-delete:hover { background-color: red; color: white; }
        .btn-confirm-save { background-color: #007bff; color: white; width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-confirm-save:hover { background-color: #0056b3; }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #333; color: white; }
        tr:hover { background-color: #f1f1f1; }

        /* MODALS */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); }
        .modal-content { background-color: white; margin: 10% auto; padding: 25px; border: 1px solid #888; width: 400px; border-radius: 10px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 20px; color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>

    <script>
        // 1. CONFIRM MODAL
        function openConfirmModal(id, name) {
            document.getElementById('confirmId').value = id;
            document.getElementById('confirmTitle').innerText = "Confirm: " + name;
            document.getElementById('confirmModal').style.display = 'block';
        }
        function closeConfirmModal() { document.getElementById('confirmModal').style.display = 'none'; }

        // 2. ADD MODAL
        function openAddModal() { document.getElementById('addModal').style.display = 'block'; }
        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

        // 3. DETAILS MODAL
        function showDetails(name, pkg, money) {
            document.getElementById('popupName').innerText = name;
            document.getElementById('popupPackage').innerText = pkg;
            document.getElementById('popupMoney').innerText = money + " €";
            document.getElementById('detailsModal').style.display = 'block';
        }
        function closeDetailsModal() { document.getElementById('detailsModal').style.display = 'none'; }
    </script>
</head>
<body>

<div class="header-bar">
    <div class="logo-area">
        <img src="/images/logo.svg" alt="ARTTU Logo" class="logo-img">
        <h2 style="margin:0;">ARTTU PARTNERS</h2>
    </div>
    <div class="user-info">
        <span th:text="'User: ' + ${username}"></span> |
        <span th:text="${userRole}" style="color: #ccc;"></span>
        <br><a href="/logout" class="logout-btn">LOGOUT</a>
    </div>
</div>

<div class="container">
    <div class="controls-bar">
        <button class="btn-add" onclick="openAddModal()">+ Add New Partner</button>
        <div>
            <strong>Filter by Year:</strong>
            <a th:href="@{/dashboard(year='All')}" class="btn-filter" th:styleappend="${param.year == null || param.year[0] == 'All'} ? 'background:#800020; color:white;' : 'background:white;'">All</a>
            <a th:href="@{/dashboard(year='2026')}" class="btn-filter" th:styleappend="${param.year != null && param.year[0] == '2026'} ? 'background:#800020; color:white;' : 'background:white;'">2026</a>
            <a th:href="@{/dashboard(year='2025')}" class="btn-filter" th:styleappend="${param.year != null && param.year[0] == '2025'} ? 'background:#800020; color:white;' : 'background:white;'">2025</a>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>Company Name</th>
            <th>Status</th>
            <th>Year</th>
            <th>Profile</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${partners}">
            <td th:text="${p.compName}"
                th:onclick="showDetails([[${p.compName}]], [[${p.sponsorshipPackage}]], [[${p.sponsorshipAmount}]])"
                style="color: #800020; font-weight: bold; cursor: pointer;">
            </td>

            <td>
                <div th:if="${userRole == 'Team Leader'}">
                    <form th:if="${p.confirmed}" th:action="@{/toggle-status/{id}(id=${p.companyId})}" method="post" style="display:inline;">
                        <button type="submit" style="background:none; border:none; cursor:pointer; font-weight:bold; padding:0;" title="Click to undo">
                            <span style="color: green;">✔ Confirmed</span>
                        </button>
                    </form>
                    <button th:unless="${p.confirmed}"
                            th:onclick="openConfirmModal([[${p.companyId}]], [[${p.compName}]])"
                            style="background:none; border:none; cursor:pointer; font-weight:bold; padding:0; color: orange;">
                        ⏳ Pending
                    </button>
                </div>
                <div th:unless="${userRole == 'Team Leader'}">
                    <span th:if="${p.confirmed}" style="color: green; font-weight:bold;">✔ Confirmed</span>
                    <span th:unless="${p.confirmed}" style="color: orange; font-weight:bold;">⏳ Pending</span>
                </div>
            </td>

            <td th:text="${p.year}"></td>
            <td th:text="${p.compProfile}"></td>
            <td>
                <form th:if="${userRole == 'Team Leader'}" th:action="@{/delete/{id}(id=${p.companyId})}" method="post" onsubmit="return confirm('Are you sure?');">
                    <button type="submit" class="btn-delete">X</button>
                </form>
                <span th:unless="${userRole == 'Team Leader'}" style="color:#ccc; font-size:12px;">🔒 Locked</span>
            </td>
        </tr>
        </tbody>
    </table>

    <div style="text-align: center; margin-top: 20px;">
        <span style="font-weight:bold;" th:text="'Page ' + ${currentPage + 1}"></span>
    </div>
    <br><hr><br>

    <h2 style="color:#800020; border-bottom: 2px solid #333; padding-bottom:10px;">TEAM DIRECTORY</h2>
    <table>
        <thead>
        <tr style="background:#333; color:white;">
            <th>Username</th> <th>Full Name</th> <th>Role</th> <th>Email</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${teamMembers}">
            <td th:text="${u.username}"></td>
            <td th:text="${u.fullName}"></td>
            <td th:text="${u.position}"></td>
            <td th:text="${u.email}"></td>
        </tr>
        </tbody>
    </table>
</div>

<div id="confirmModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeConfirmModal()">&times;</span>
        <h2 id="confirmTitle" style="color:#007bff;">Confirm Partner</h2>
        <form action="/confirm-partner" method="post">
            <input type="hidden" id="confirmId" name="companyId">

            <label>Sponsorship Package:</label>
            <input type="text" name="pkgName" placeholder="e.g. Platinum, Gold" required>

            <label>Amount (€):</label>
            <input type="number" step="0.01" name="amount" placeholder="20000" required>

            <label>Season:</label>
            <select name="year">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
            </select>

            <button type="submit" class="btn-confirm-save">Confirm & Save</button>
        </form>
    </div>
</div>

<div id="addModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAddModal()">&times;</span>
        <h2 style="color:#800020;">Add New Partner</h2>
        <form action="/add" method="post">
            <input type="text" name="compName" placeholder="Company Name" required>
            <input type="text" name="compProfile" placeholder="Profile" required>
            <button type="submit" class="btn-add" style="width:100%;">Save Partner</button>
        </form>
    </div>
</div>

<div id="detailsModal" class="modal">
    <div class="modal-content" style="text-align:center;">
        <span class="close-btn" onclick="closeDetailsModal()">&times;</span>
        <h2 id="popupName" style="color: #800020;"></h2>
        <p>Package: <strong id="popupPackage"></strong></p>
        <p>Value: <strong id="popupMoney" style="color:green;"></strong></p>
        <button onclick="closeDetailsModal()" style="padding:10px; background:#333; color:white; border:none; border-radius:5px; cursor:pointer;">Close</button>
    </div>
</div>

</body>
</html>
